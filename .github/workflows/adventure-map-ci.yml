name: Adventure Map CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # package-lock.json predates current package.json dependencies in this repo.
        # Do not let that unrelated legacy drift block map validation.
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Validate adventure maps
        run: npm run test:maps

      - name: Production build
        run: npm run build
