<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dice Hero 強制更新</title>
  <style>
    body {
      margin: 0; display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #0a1228; font-family: sans-serif; color: #a8d4ff;
      flex-direction: column; gap: 16px; text-align: center; padding: 20px;
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #1a3a6b;
      border-top-color: #4a8fe8; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { margin: 0; font-size: 18px; }
    p  { margin: 0; color: #6a9fd8; font-size: 14px; }
    a  { color: #4a8fe8; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>正在清除舊版快取…</h2>
  <p id="status">初始化</p>

  <script>
    const status = document.getElementById('status')
    async function run() {
      try {
        // 1. 取消所有 Service Worker 註冊
        status.textContent = '卸載 Service Worker…'
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations()
          await Promise.all(regs.map(r => r.unregister()))
        }

        // 2. 清除所有 Cache Storage
        status.textContent = '清除快取…'
        if ('caches' in window) {
          const keys = await caches.keys()
          await Promise.all(keys.map(k => caches.delete(k)))
        }

        // 3. 清除版本 key，讓主程式重新比對
        localStorage.removeItem('dh_build')

        status.textContent = '完成！正在跳轉…'
        // 4. 回到主頁，此時沒有 SW 攔截，瀏覽器直接抓最新資源
        setTimeout(() => { window.location.replace('/') }, 800)
      } catch (e) {
        status.innerHTML = '發生錯誤：' + e.message +
          '<br><a href="/">手動點此返回</a>'
      }
    }
    run()
  </script>
</body>
</html>
